name: Build Flashable Zip
on: [push]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Binary
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk
          cargo ndk -t arm64-v8a build --release
          mkdir -p system/bin
          cp target/aarch64-linux-android/release/resource-orchestrator system/bin/
      - name: Create Magisk Module Zip
        run: |
          zip -r Neural-Governor.zip module.prop customize.sh service.sh system README.md
      - uses: actions/upload-artifact@v4
        with:
          name: Neural-Governor-zip
          path: Neural-Governor.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Neural-Governor.zip
